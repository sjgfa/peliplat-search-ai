<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeliPlat AI - 智能体电影推荐</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #ff0055;
            --secondary-color: #00e5ff;
            --bg-color: #050505;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-color: #fff;
            --text-sec: #aaaaaa;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            --transition: all 0.4s cubic-bezier(0.215, 0.610, 0.355, 1);
            --border-radius: 16px;
            --card-blur: blur(10px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 0;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            perspective: 1000px;
        }

        /* 背景动态光效 */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background:
                radial-gradient(circle at 15% 50%, rgba(255, 0, 85, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 229, 255, 0.15), transparent 25%);
            filter: blur(50px);
            animation: bgPulse 10s infinite alternate;
        }

        @keyframes bgPulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Hero 区域样式 */
        .hero-section {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: visible;
            margin-bottom: 60px;
        }

        .hero-content {
            position: relative;
            z-index: 10;
            text-align: center;
            margin-bottom: 40px;
        }

        /* 3D 场景核心 */
        .scene {
            width: 260px;
            height: 400px;
            position: relative;
            perspective: 1000px;
            margin: 40px auto;
        }

        .carousel {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            animation: rotate 20s infinite linear;
        }

        .carousel:hover {
            animation-play-state: paused;
        }

        .carousel__cell {
            position: absolute;
            width: 240px;
            height: 360px;
            left: 10px;
            top: 10px;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.1);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .carousel__cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.7);
            transition: filter 0.3s;
        }

        .carousel__cell:hover img {
            filter: brightness(1.1);
        }

        .carousel__cell:nth-child(1) { transform: rotateY(0deg) translateZ(350px); }
        .carousel__cell:nth-child(2) { transform: rotateY(60deg) translateZ(350px); }
        .carousel__cell:nth-child(3) { transform: rotateY(120deg) translateZ(350px); }
        .carousel__cell:nth-child(4) { transform: rotateY(180deg) translateZ(350px); }
        .carousel__cell:nth-child(5) { transform: rotateY(240deg) translateZ(350px); }
        .carousel__cell:nth-child(6) { transform: rotateY(300deg) translateZ(350px); }

        @keyframes rotate {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            position: relative;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            border-radius: 3px;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
            font-weight: 700;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .subtitle {
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
            animation: fadeIn 1.2s ease;
        }

        .search-box {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: var(--card-blur);
            -webkit-backdrop-filter: var(--card-blur);
            border-radius: 50px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: var(--transition);
            animation: slideIn 1.5s ease;
        }

        @keyframes slideIn {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .search-box:focus-within {
            box-shadow: 0 15px 30px rgba(255, 0, 85, 0.3);
            transform: translateY(-5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #search-input {
            flex: 1;
            border: none;
            padding: 20px 25px;
            font-size: 1.1rem;
            outline: none;
            background: transparent;
            color: white;
            font-family: 'Montserrat', sans-serif;
        }

        #search-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        #search-button {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 18px 35px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        #search-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: var(--transition);
            z-index: -1;
        }

        #search-button:hover::before {
            width: 100%;
        }

        #search-button i {
            margin-right: 10px;
            font-size: 1.2rem;
        }

        #search-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 40px 0;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--secondary-color);
            border-left: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1.2s linear infinite;
            margin: 0 auto;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.3);
        }

        .loading p {
            margin-top: 15px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
            animation: pulse 2s infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-steps {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .step {
            display: flex;
            align-items: center;
            opacity: 0.4;
            transition: var(--transition);
            padding: 8px 15px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
        }

        .step.active {
            opacity: 1;
            background: rgba(255, 0, 85, 0.2);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
        }

        .step i {
            margin-right: 12px;
            font-size: 1.1rem;
            color: var(--secondary-color);
        }

        .step span {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .explanation-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: var(--card-blur);
            -webkit-backdrop-filter: var(--card-blur);
            border-radius: var(--border-radius);
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.8s ease;
        }

        .explanation-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-color);
            display: flex;
            align-items: center;
        }

        .explanation-title i {
            margin-right: 10px;
            color: var(--secondary-color);
        }

        .explanation-text {
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
        }

        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: var(--secondary-color);
            margin-left: 2px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 30px;
            perspective: 1000px;
        }

        .movie-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: var(--card-blur);
            -webkit-backdrop-filter: var(--card-blur);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transform-style: preserve-3d;
            animation: cardFadeIn 0.8s ease;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(30px) rotateX(10deg); }
            to { opacity: 1; transform: translateY(0) rotateX(0); }
        }

        .movie-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .movie-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg,
                       rgba(255, 0, 85, 0.15) 0%,
                       rgba(0, 229, 255, 0.15) 100%);
            opacity: 0;
            transition: var(--transition);
            z-index: 1;
            pointer-events: none;
        }

        .movie-card:hover::before {
            opacity: 1;
        }

        /* 装饰性发光条 */
        .movie-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s;
            z-index: 20;
        }

        .movie-card:hover::after {
            transform: scaleX(1);
        }

        .movie-poster {
            width: 100%;
            height: 380px;
            object-fit: cover;
            transition: var(--transition);
        }

        .movie-card:hover .movie-poster {
            transform: scale(1.05);
        }

        .movie-info {
            padding: 25px;
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
        }

        .movie-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--text-color);
            line-height: 1.3;
            background: linear-gradient(to right, #ffffff, #e6e6e6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .year {
            display: flex;
            align-items: center;
        }

        .year i {
            margin-right: 8px;
            color: var(--secondary-color);
        }

        .rating {
            display: flex;
            align-items: center;
        }

        .rating i {
            color: #ffcc00;
            margin-right: 8px;
            animation: starPulse 3s infinite;
        }

        @keyframes starPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .movie-type {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 7px 15px;
            border-radius: 25px;
            font-size: 0.8rem;
            font-weight: 600;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 60px 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: var(--card-blur);
            -webkit-backdrop-filter: var(--card-blur);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.8s ease;
        }

        .no-results i {
            font-size: 4rem;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 20px;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .no-results h3 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: var(--text-color);
        }

        .no-results p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .scene {
                transform: scale(0.7) translateY(-20px);
            }

            .carousel__cell {
                width: 180px;
                height: 270px;
            }

            .carousel__cell:nth-child(1) { transform: rotateY(0deg) translateZ(250px); }
            .carousel__cell:nth-child(2) { transform: rotateY(60deg) translateZ(250px); }
            .carousel__cell:nth-child(3) { transform: rotateY(120deg) translateZ(250px); }
            .carousel__cell:nth-child(4) { transform: rotateY(180deg) translateZ(250px); }
            .carousel__cell:nth-child(5) { transform: rotateY(240deg) translateZ(250px); }
            .carousel__cell:nth-child(6) { transform: rotateY(300deg) translateZ(250px); }

            .search-box {
                flex-direction: column;
                border-radius: var(--border-radius);
            }

            #search-input {
                width: 100%;
                border-radius: var(--border-radius) var(--border-radius) 0 0;
                padding: 15px 20px;
            }

            #search-button {
                width: 100%;
                border-radius: 0 0 var(--border-radius) var(--border-radius);
                padding: 15px 20px;
            }

            .results {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1.1rem;
            }

            .hero-section {
                min-height: 50vh;
            }
        }

        footer {
            text-align: center;
            margin-top: 70px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            position: relative;
        }

        footer::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <!-- 动态背景光效 -->
    <div class="bg-glow"></div>

    <!-- Hero 区域 (3D 旋转木马) -->
    <section class="hero-section">
        <div class="scene">
            <div class="carousel" id="movieCarousel">
                <!-- 旋转木马中的电影海报将通过 JavaScript 动态填充 -->
                <div class="carousel__cell"><img src="https://image.tmdb.org/t/p/w500/q6y0Go1tsGEsmtFryDOJo3dEmqu.jpg" alt="Poster 1"></div>
                <div class="carousel__cell"><img src="https://image.tmdb.org/t/p/w500/r2J02Z2OpNTctfOSN1Ydgii51I3.jpg" alt="Poster 2"></div>
                <div class="carousel__cell"><img src="https://image.tmdb.org/t/p/w500/8Vt6mWEReuy4Of61Lnj5Xj704m8.jpg" alt="Poster 3"></div>
                <div class="carousel__cell"><img src="https://image.tmdb.org/t/p/w500/iiZZdoQBEYBv6id8su7ImL0oCbD.jpg" alt="Poster 4"></div>
                <div class="carousel__cell"><img src="https://image.tmdb.org/t/p/w500/db32LaOibwEliAmSL2jjDF6oDdj.jpg" alt="Poster 5"></div>
                <div class="carousel__cell"><img src="https://image.tmdb.org/t/p/w500/t6HIqrRAclMCA60NsSmeqe9RmNV.jpg" alt="Poster 6"></div>
            </div>
        </div>

        <div class="hero-content">
            <h1>探索电影宇宙</h1>
            <p class="subtitle">Peliplat AI - 智能体电影推荐系统</p>
        </div>
    </section>

    <div class="container">
        <header style="border-bottom: none; padding-bottom: 0;">
            <!-- Header 内容移到了上面的 hero-content -->
        </header>

        <div class="search-box">
            <input type="text" id="search-input" placeholder="请输入您想要的电影类型，如：推荐一些爱国主义电影..." autofocus>
            <button id="search-button"><i class="fas fa-search"></i> 开始推荐</button>
        </div>

        <div class="loading">
            <div class="loader"></div>
            <p id="loading-text">智能体正在为您推荐电影...</p>
            <div class="loading-steps">
                <div class="step active" data-step="extract">
                    <i class="fas fa-brain"></i>
                    <span>AI提取关键词...</span>
                </div>
                <div class="step" data-step="autocomplete">
                    <i class="fas fa-search"></i>
                    <span>搜索关键词匹配...</span>
                </div>
                <div class="step" data-step="movies">
                    <i class="fas fa-film"></i>
                    <span>获取电影信息...</span>
                </div>
                <div class="step" data-step="complete">
                    <i class="fas fa-check-circle"></i>
                    <span>完成推荐...</span>
                </div>
            </div>
        </div>

        <!-- 推荐理由区域 -->
        <div class="explanation-section" id="explanationSection" style="display: none;">
            <div class="explanation-title"><i class="fas fa-lightbulb"></i> 推荐理由</div>
            <div class="explanation-text" id="explanationText"></div>
        </div>

        <div class="results"></div>

        <footer>
            <p>PeliPlat AI &copy; 2025 - AI-powered movie recommendations</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            const searchButton = document.getElementById('search-button');
            const resultsContainer = document.querySelector('.results');
            const loadingIndicator = document.querySelector('.loading');
            const explanationSection = document.getElementById('explanationSection');
            const explanationText = document.getElementById('explanationText');
            
            let currentEventSource = null;

            // 加载步骤动画
            function animateLoadingSteps() {
                const steps = document.querySelectorAll('.step');
                steps.forEach(step => step.classList.remove('active'));
                
                let currentStep = 0;
                const stepInterval = setInterval(() => {
                    if (currentStep < steps.length) {
                        steps[currentStep].classList.add('active');
                        currentStep++;
                    } else {
                        clearInterval(stepInterval);
                    }
                }, 1500);
                
                return stepInterval;
            }

            // 监听搜索按钮点击事件
            searchButton.addEventListener('click', function() {
                performSearch();
            });

            // 监听回车键
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    performSearch();
                }
            });

            // 执行搜索
            function performSearch() {
                const query = searchInput.value.trim();
                
                if (query.length === 0) {
                    alert('请输入搜索内容');
                    return;
                }
                
                // 关闭之前的连接
                if (currentEventSource) {
                    currentEventSource.close();
                }
                
                // 显示加载指示器
                loadingIndicator.style.display = 'block';
                resultsContainer.innerHTML = '';
                explanationSection.style.display = 'none';
                explanationText.innerHTML = '';
                
                // 禁用搜索按钮
                searchButton.disabled = true;
                searchButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 推荐中...';
                
                // 开始加载步骤动画
                const stepInterval = animateLoadingSteps();
                
                // 创建SSE连接
                const encodedQuery = encodeURIComponent(query);
                currentEventSource = new EventSource(`/api/movie-tool/agent-search?query=${encodedQuery}`);
                
                currentEventSource.addEventListener('start', (event) => {
                    const data = JSON.parse(event.data);
                    console.log('推荐开始:', data);
                });

                let searchMethod = 'keyword_search'; // 默认关键词搜索

                currentEventSource.addEventListener('search_method', (event) => {
                    const data = JSON.parse(event.data);
                    console.log('搜索方式:', data);
                    searchMethod = data.method;

                    // 更新加载文本显示搜索方式
                    const loadingText = document.getElementById('loading-text');
                    if (loadingText) {
                        loadingText.textContent = data.message || '正在搜索电影...';
                    }

                    // 根据搜索方式激活对应步骤
                    const steps = document.querySelectorAll('.step');
                    if (searchMethod === 'keyword_search') {
                        // 关键词搜索流程：已经完成了前面的步骤，激活后续步骤
                        steps.forEach((step, idx) => {
                            if (idx < 2) step.classList.add('active');
                        });
                    } else if (searchMethod === 'ai_recommendation') {
                        // AI推荐流程：重置步骤，显示AI推荐步骤
                        steps.forEach(step => step.classList.remove('active'));
                    }
                });
                
                currentEventSource.addEventListener('movies_extracted', (event) => {
                    const data = JSON.parse(event.data);
                    console.log('提取的电影名称:', data.movieNames);
                });
                
                currentEventSource.addEventListener('movies_found', (event) => {
                    const data = JSON.parse(event.data);
                    console.log('找到电影:', data.movies);

                    // 激活"获取电影信息"步骤
                    const steps = document.querySelectorAll('.step');
                    if (steps[2]) steps[2].classList.add('active');

                    displayResults(data.movies);
                });
                
                currentEventSource.addEventListener('explanation_chunk', (event) => {
                    const data = JSON.parse(event.data);
                    appendExplanation(data.text, data.isLast);
                });
                
                currentEventSource.addEventListener('complete', (event) => {
                    const data = JSON.parse(event.data);
                    console.log('推荐完成');

                    // 激活"完成推荐"步骤
                    const steps = document.querySelectorAll('.step');
                    if (steps[3]) steps[3].classList.add('active');

                    clearInterval(stepInterval);

                    // 延迟隐藏加载指示器，让用户看到完成状态
                    setTimeout(() => {
                        loadingIndicator.style.display = 'none';
                    }, 500);

                    searchButton.disabled = false;
                    searchButton.innerHTML = '<i class="fas fa-search"></i> 开始推荐';

                    if (currentEventSource) {
                        currentEventSource.close();
                        currentEventSource = null;
                    }
                });
                
                currentEventSource.addEventListener('error', (event) => {
                    const data = JSON.parse(event.data);
                    console.error('推荐错误:', data.message);
                    clearInterval(stepInterval);
                    loadingIndicator.style.display = 'none';
                    searchButton.disabled = false;
                    searchButton.innerHTML = '<i class="fas fa-search"></i> 开始推荐';
                    
                    resultsContainer.innerHTML = `
                        <div class="no-results">
                            <i class="fas fa-exclamation-circle"></i>
                            <h3>推荐失败</h3>
                            <p>${data.message || '未知错误，请重试'}</p>
                        </div>
                    `;
                    
                    if (currentEventSource) {
                        currentEventSource.close();
                        currentEventSource = null;
                    }
                });
                
                currentEventSource.onerror = function(event) {
                    console.error('SSE连接错误:', event);
                    clearInterval(stepInterval);
                    loadingIndicator.style.display = 'none';
                    searchButton.disabled = false;
                    searchButton.innerHTML = '<i class="fas fa-search"></i> 开始推荐';
                    
                    resultsContainer.innerHTML = `
                        <div class="no-results">
                            <i class="fas fa-exclamation-circle"></i>
                            <h3>连接中断</h3>
                            <p>请检查网络连接并重试</p>
                        </div>
                    `;
                    
                    if (currentEventSource) {
                        currentEventSource.close();
                        currentEventSource = null;
                    }
                };
            }

            // 显示结果
            function displayResults(movies) {
                if (!movies || movies.length === 0) {
                    resultsContainer.innerHTML = `
                        <div class="no-results">
                            <i class="fas fa-film"></i>
                            <h3>没有找到电影</h3>
                            <p>尝试不同的搜索关键词或查看我们的推荐。</p>
                        </div>
                    `;
                    return;
                }

                // 按年份倒序排列（确保前端显示顺序正确）
                const sortedMovies = [...movies].sort((a, b) => {
                    const yearA = a.publicationYear;
                    const yearB = b.publicationYear;

                    // null 排在后面
                    if (yearA == null && yearB == null) return 0;
                    if (yearA == null) return 1;
                    if (yearB == null) return -1;

                    // 倒序：年份大的在前
                    return yearB - yearA;
                });

                // 添加每个电影卡片
                sortedMovies.forEach((movie, index) => {
                    if (movie && typeof movie === 'object' && movie.title) {
                        const movieElement = createMovieCard(movie, index);
                        resultsContainer.appendChild(movieElement);
                    }
                });

                // 为新添加的卡片添加3D效果
                add3DCardEffects();
            }

            // 创建电影卡片
            function createMovieCard(movie, index) {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.style.animationDelay = `${index * 0.1}s`;
                
                // Set movie click event to redirect to detail page
                card.addEventListener('click', function() {
                    if (movie.ppId) {
                        // 优化title slug生成：保留字母、数字，处理特殊字符
                        let titleSlug = (movie.title || '')
                            .toLowerCase()
                            .replace(/[^a-z0-9\s-]/g, '') // 只保留字母、数字、空格、横杠
                            .trim() // 去除首尾空格
                            .replace(/\s+/g, '-') // 空格替换为横杠
                            .replace(/-+/g, '-') // 多个连续横杠替换为单个
                            .replace(/^-+|-+$/g, ''); // 去除首尾横杠

                        // 如果处理后的 titleSlug 为空，使用 ppId 作为后备
                        if (!titleSlug || titleSlug.length === 0) {
                            console.warn('Title slug is empty for movie:', movie.title, 'Using ppId:', movie.ppId);
                            titleSlug = movie.ppId || 'movie';
                        }

                        const detailUrl = `https://www.peliplat.com/en/library/movie/${movie.ppId}/${titleSlug}`;
                        console.log('Opening movie:', movie.title, '→', detailUrl);
                        window.open(detailUrl, '_blank');
                    }
                });
                
                // 设置电影类型标签
                const mediaType = movie.mediaType === 3 ? 'Movie' : 'TV Show';
                
                // 处理缺失的海报
                const posterUrl = movie.photoUrl || 'https://via.placeholder.com/300x450?text=No+Poster';
                
                // 创建卡片内容
                card.innerHTML = `
                    <div class="movie-type">${mediaType}</div>
                    <img src="${posterUrl}" alt="${movie.title}" class="movie-poster">
                    <div class="movie-info">
                        <h3 class="movie-title">${movie.title}</h3>
                        <div class="movie-meta">
                            <span class="year"><i class="far fa-calendar-alt"></i> ${movie.publicationYear || 'Unknown'}</span>
                            <span class="rating"><i class="fas fa-star"></i> ${movie.rating || 'N/A'}</span>
                        </div>
                    </div>
                `;
                
                return card;
            }

            // 添加推荐理由文本
            function appendExplanation(text, isLast) {
                if (explanationSection.style.display === 'none') {
                    explanationSection.style.display = 'block';
                }
                
                explanationText.innerHTML += text;
                
                if (!isLast) {
                    // 添加打字机光标效果
                    const cursor = document.createElement('span');
                    cursor.className = 'typing-cursor';
                    explanationText.appendChild(cursor);
                    
                    // 移除之前的光标
                    setTimeout(() => {
                        const cursors = explanationText.querySelectorAll('.typing-cursor');
                        if (cursors.length > 1) {
                            cursors[0].remove();
                        }
                    }, 100);
                } else {
                    // 移除所有光标
                    const cursors = explanationText.querySelectorAll('.typing-cursor');
                    cursors.forEach(cursor => cursor.remove());
                }
            }

            // 3D 倾斜卡片脚本逻辑
            function add3DCardEffects() {
                const cards = document.querySelectorAll('.movie-card');

                cards.forEach(card => {
                    card.addEventListener('mousemove', (e) => {
                        const rect = card.getBoundingClientRect();
                        const x = e.clientX - rect.left;
                        const y = e.clientY - rect.top;

                        const centerX = rect.width / 2;
                        const centerY = rect.height / 2;

                        const rotateX = ((y - centerY) / centerY) * -10;
                        const rotateY = ((x - centerX) / centerX) * 10;

                        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
                    });

                    card.addEventListener('mouseleave', () => {
                        card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)`;
                    });
                });
            }

            // 页面离开时关闭连接
            window.addEventListener('beforeunload', () => {
                if (currentEventSource) {
                    currentEventSource.close();
                }
            });
        });
    </script>
</body>
</html>
